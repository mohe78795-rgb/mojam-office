<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML2 — مركز الكشوف</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><style>:root{--red:#991b1b;--ink:#172033;--line:#e2e8f0;--bg:#f8fafc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.top{background:linear-gradient(135deg,#172554,#4338ca);color:#fff;padding:18px}.bar,.wrap{max-width:1200px;margin:auto}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar h1{margin:0;font-size:22px}.bar p{margin:4px 0 0;font-size:12px;opacity:.85}.bar>div{flex:1}.bar a,.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none;font-size:12px}.bar a{background:#fff;color:#312e81}.btn{background:#172033;color:#fff}.btn.blue{background:#4338ca}.btn.light{background:#fff;color:#172033;border:1px solid #cbd5e1}.wrap{padding:18px}.toolbar,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 5px 18px #0f172a0c}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:15px}.field{font-size:12px;font-weight:800}.field input,.field select{display:block;margin-top:6px;padding:10px;border:1px solid #cbd5e1;border-radius:9px;min-width:160px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.kpi{padding:15px;border-radius:12px;background:#f1f5f9}.kpi b{display:block;font-size:22px;margin-top:6px}.report{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;min-height:350px;overflow:auto}.report h2{margin:0 0 12px;text-align:center}.report h3{border-bottom:2px solid #172033;padding-bottom:6px;margin-top:20px}.report table{width:100%;border-collapse:collapse;text-align:center;font-size:12px}.report th,.report td{border:1px solid #334155;padding:7px}.report th{background:#172033 );gap:16px;margin-top:28px;text-align:center;font-size:11px;font-weight:700}.daily-signatures div{border-top:1px solid #475569;padding-top:7px}.daily-empty{text-align:center;color:#64748b;padding:10px;font-weight:700}@media(max-width:900px){.daily-capsules{grid-template-columns:repeat(2,1fr)}.daily-final-totals,.daily-signatures{grid-template-columns:1fr}.daily-paper{padding:8px}.daily-formal-table{font-size:9px}}

</style></head><body><header class="top"><div class="bar"><div><h1>HTML2 — مركز الكشوف والتقارير</h1><p>قراءة مباشرة من نفس سجلات النظام اليومية.</p></div><a href="index.html">العودة للنظام</a><a href="HTML1.html">مركز الطابعات</a></div></header><main class="wrap"><section class="toolbar no-print"><label class="field">التاريخ<input id="date" type="date"></label><label class="field">نوع الكشف<select id="kind"><option value="daily">الكشف اليومي</option><option value="invoices">الفواتير</option><option value="cards">كروت الموردين</option><option value="expenses">المصاريف</option></select></label><label class="field" id="cardField" style="display:none">الكرت<select id="card"></select></label><button class="btn blue" onclick="render()">عرض الكشف</button><button class="btn" onclick="printPdf()">طباعة / PDF</button></section><section id="kpis" class="cards"></section><section id="report" class="report"></section></main><script>const CATS=['كبير','وسط','مطاعم','جفش','صغير'];const $=id=>document.getElementById(id);let date='',invoices=[],cards=[],expenses=[];function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d}catch(e){return d}}function fmt(v){return (+v||0).toLocaleString('en-US')}function saveCollectors(){localStorage.setItem('mojam_cash_collectors',JSON.stringify([1,2,3,4,5].map(i=>$("collector-"+i)?.value.trim()||'')));render();}function loadCollectors(){const a=read('mojam_cash_collectors',[]);[1,2,3,4,5].forEach(i=>{const e=$("collector-"+i);if(e)e.value=a[i-1]||'';e?.addEventListener('change',saveCollectors);});}function dayName(d){try{return new Intl.DateTimeFormat('ar-YE',{weekday:'long'}).format(new Date(d+'T00:00:00'));}catch(e){return '';}}function esc(v){return String(v??'').replace(/[&<>"']/g,'')}function cardTotal(c,cat){return (c.lines||[]).filter(x=>x.cat===cat).reduce((t,x)=>t+Math.max(0,(+x.boxes||0)*(+x.cap||0)+(+x.plus||0)-(+x.dead||0)-(+x.returned||+x.returns||0)),0)}function load(){date=$('date').value||localStorage.getItem('mojam_date')||(()=>{const d=new Date();return d.toISOString().slice(0,10)})();$('date').value=date;invoices=read('mojam_invoices_'+date,[]);cards=read('mojam_incoming_cards_'+date,[]);expenses=read('mojam_expenses_'+date,[]);$('card').innerHTML='<option value="">اختر كرتًا</option>'+cards.map(c=>`<option value="${esc(c.id)}">كرت ${esc(c.no)} — ${esc(c.supplier)}</option>`).join('');render()}function render(){const kind=$('kind').value;$('cardField').style.display=kind==='cards'?'block':'none';const sales=invoices.reduce((s,x)=>s+(+x.total||0),0),cash=invoices.filter(x=>x.type==='نقد').reduce((s,x)=>s+(+x.total||0),0),credit=sales-cash,exp=expenses.reduce((s,x)=>s+(+x.amount||0),0)+cards.reduce((s,c)=>s+(c.expenses||[]).reduce((a,x)=>a+(+x.amount||0),0),0);$('kpis').innerHTML=`<div class="kpi">إجمالي المبيعات<b>${fmt(sales)}</b></div><div class="kpi">نقدًا<b>${fmt(cash)}</b></div><div class="kpi">آجل<b>${fmt(credit)}</b></div><div class="kpi">المصاريف<b>${fmt(exp)}</b></div>`;if(kind==='invoices')invoiceReport();else if(kind==='cards')cardReport();else if(kind==='expenses')expenseReport();else dailyReport(sales,cash,credit,exp)}function dailyReport(sales,cash,credit,exp){
 const safe=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
 const money=v=>fmt(v); const saleType=i=>{const t=String(i.type||'نقد').replace('اً','ا').replace('ً','');return t.includes('آجل')?'آجل':'نقد';}; const metaById=Object.fromEntries(cards.map(c=>[c.id,c]));
 const cardFor=(i,item)=>{const ids=[i.supplierCardId,item?.supplierCardId].filter(Boolean);let c=ids.map(id=>metaById[id]).find(Boolean);if(c)return c;const no=i.cardNo||item?.cardNo;if(no){c=cards.find(x=>String(x.no||'')===String(no));if(c)return c;}const supplier=i.supplier||item?.supplier,driver=i.driver||item?.driver;return cards.find(x=>(supplier&&String(x.supplier||'')===String(supplier))||(driver&&String(x.driver||'')===String(driver)))||{};};
 const customer=(i,c)=>{const n=String(i.customer||'').trim();return n&&n!=='عميل عام'?n:(c.receiver||i.receiver||'مبيعات نقداً');};
 const linkedCards=cards.length?cards:[{}];
 const soldFor=(cat,cardId)=>invoices.filter(i=>!cardId||i.supplierCardId===cardId||((i.items||[]).some(x=>x.supplierCardId===cardId))).reduce((sum,i)=>sum+(i.items||[]).filter(x=>x.name===cat).reduce((a,x)=>a+(+x.qty||0),0),0);
 const incomingRows=cards.flatMap(c=>(c.lines||[]).filter(x=>['boxes','cap','plus','dead','returned','returns'].some(k=>(+x[k]||0)>0)).map(x=>{const cat=x.cat, incoming=(+x.boxes||0)*(+x.cap||0)+(+x.plus||0)-(+x.dead||0)-(+x.returned||+x.returns||0), sold=invoices.filter(i=>i.supplierCardId===c.id||(i.items||[]).some(it=>it.supplierCardId===c.id)).reduce((s,i)=>s+(i.items||[]).filter(it=>it.name===cat&&(!it.supplierCardId||it.supplierCardId===c.id)).reduce((a,it)=>a+(+it.qty||0),0),0);return `<tr><td>${safe(c.supplier||'—')}</td><td>${safe(c.farm||'—')}</td><td>${safe(cat==='جفش'?'جفوش':cat)}</td><td>${money(x.boxes)}</td><td>${money(x.cap)}</td><td>${money((+x.boxes||0)*(+x.cap||0))}</td><td>${money(x.plus)}</td><td>${money(x.dead)}</td><td>${money(x.returned||x.returns)}</td><td>${money(sold)}</td><td>${money(incoming-sold)}</td></tr>`;})).join('');
 const incomingTotals=cards.reduce((a,c)=>{(c.lines||[]).forEach(x=>{a.boxes+=(+x.boxes||0);a.incoming+=(+x.boxes||0)*(+x.cap||0)+(+x.plus||0)-(+x.dead||0)-(+x.returned||+x.returns||0);a.dead+=(+x.dead||0);a.remaining+=(+x.boxes||0)*(+x.cap||0)+(+x.plus||0)-(+x.dead||0)-(+x.returned||+x.returns||0);});return a;},{boxes:0,incoming:0,dead:0,remaining:0});
 const invoiceRows=(kind)=>invoices.filter(i=>saleType(i)===kind).flatMap(i=>{const items=(i.items||[]).filter(x=>x.qty!=='-'&&x.price!=='-');return (items.length?items:[{}]).map((x,n)=>{const c=cardFor(i,x);return `<tr><td>${n===0?safe(i.num):'↳'}</td><td>${n===0?safe(customer(i,c)):''}</td><td>${safe(x.name||'—')}</td><td>${safe(x.qty||'—')}</td><td class="money">${money(x.price||0)}</td><td class="money">${money(x.total||0)}</td>${kind==='نقد'?`<td>${safe(i.cashCollector||i.collector||i.cashier||customer(i,c))}</td>`:''}<td>${money(i.emptyCratesReceived||i.crates||0)}</td></tr>`;});}).join('');
 const creditRows=invoiceRows('آجل')||'<tr><td colspan="7" class="daily-empty">لا توجد مبيعات آجلة</td></tr>';const cashRows=invoiceRows('نقد')||'<tr><td colspan="8" class="daily-empty">لا توجد مبيعات نقدية</td></tr>';
 const collectors={};invoices.filter(i=>saleType(i)==='نقد').forEach(i=>{const c=cardFor(i);const n=String(i.cashCollector||i.collector||i.cashier||i.cashReceiver||i.receiver||c.receiver||customer(i,c)).trim()||'مبيعات نقداً';collectors[n]=(collectors[n]||0)+(+i.total||0);});const collectorRows=Object.entries(collectors).sort((a,b)=>b[1]-a[1]).map(([n,v],ix)=>`<tr><td>${ix+1}</td><td>${safe(n)}</td><td class="money">${money(v)} ريال</td></tr>`).join('')||'<tr><td colspan="3" class="daily-empty">لا توجد مقبوضات نقدية</td></tr>';
 const expenseRows=[...expenses,...cards.flatMap(c=>(c.expenses||[]).map(e=>({...e,card:c.no})))].map((e,ix)=>`<tr><td>${ix+1}</td><td>${safe(e.name||e.cat||'مصروف')}</td><td class="money">${money(e.amount)} ريال</td><td>${safe(e.notes||e.card||'—')}</td></tr>`).join('')||'<tr><td colspan="4" class="daily-empty">لا توجد مصاريف</td></tr>';const totalExp=expenses.reduce((a,e)=>a+(+e.amount||0),0)+cards.reduce((a,c)=>a+(c.expenses||[]).reduce((z,e)=>z+(+e.amount||0),0),0);
 const first=cards[0]||{};const headerCard=first;const displayDate=String(date||'').split('-').reverse().join('-');const headerCustomer=[...new Set(invoices.map(i=>customer(i,cardFor(i))).filter(Boolean))].join('، ')||'—';
