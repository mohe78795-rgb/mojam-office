<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة مكتب معجم</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font-family:Tahoma,Arial,sans-serif}.top{background:linear-gradient(135deg,#7f1d1d,#111827);color:#fff;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:22px}.top small{opacity:.75}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:16px;box-shadow:0 8px 30px #0f172a12;padding:18px;margin-bottom:18px}.login{max-width:430px;margin:60px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.field label{display:block;font-size:12px;font-weight:bold;color:#475569}.field input,.field select{width:100%;margin-top:5px;padding:11px;border:1px solid #cbd5e1;border-radius:9px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:bold;cursor:pointer;background:#991b1b;color:#fff}.btn.secondary{background:#475569}.btn.green{background:#15803d}.btn.orange{background:#c2410c}.btn.red{background:#b91c1c}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.msg{display:none;padding:10px;border-radius:9px;margin-top:12px;font-size:13px;font-weight:bold}.msg.show{display:block}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px}.stat b{display:block;font-size:23px;color:#991b1b}.table-wrap{overflow:auto}.user{border:1px solid #e2e8f0;border-radius:13px;padding:12px;margin:9px 0}.user-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{display:inline-block;border-radius:999px;background:#e2e8f0;padding:4px 8px;font-size:11px}.badge.pending{background:#fef3c7;color:#92400e}.badge.active{background:#dcfce7;color:#166534}.badge.blocked{background:#fee2e2;color:#991b1b}.perm-box{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;margin-top:10px}.perms{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px;margin-top:9px}.perms label{background:#fff;border:1px solid #e2e8f0;border-radius:7px;padding:7px;font-size:11px}.hidden{display:none!important}
</style>
</head>
<body>
<header class="top"><div><h1>لوحة إدارة مكتب معجم</h1><small>الموافقة والصلاحيات وقاعدة البيانات</small></div><button id="logout" class="btn secondary hidden">تسجيل خروج</button></header>
<main class="wrap">
<section id="login-card" class="card login"><h2>دخول المدير</h2><p>هذه اللوحة مستقلة عن الواجهة العامة، وتعمل من الرابط <b>/admin</b>.</p><form id="login-form"><div class="grid"><div class="field"><label>رقم الموظف<input name="employeeCode" required autocomplete="username"></label></div><div class="field"><label>كلمة المرور<input type="password" name="password" required autocomplete="current-password"></label></div></div><button class="btn" style="width:100%;margin-top:14px">دخول لوحة الإدارة</button></form><div id="login-msg" class="msg"></div></section>
<section id="dashboard" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h2 style="margin:0">نظرة عامة</h2><small id="db-label"></small></div><div class="actions"><button id="refresh" class="btn secondary">تحديث</button></div></div><div id="stats" class="stats" style="margin-top:14px"></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">طلبات العاملين والصلاحيات</h2><span class="badge">MongoDB</span></div><div id="users"></div></div></section>
</main>
<script>
(function(){const API=window.MOJAM_API_BASE||location.origin,TOKEN='mojam_admin_token';let token=localStorage.getItem(TOKEN);const $=id=>document.getElementById(id);const msg=(id,text,ok=false)=>{const e=$(id);e.textContent=text;e.className='msg show';e.style.background=ok?'#dcfce7':'#fee2e2';e.style.color=ok?'#166534':'#991b1b'};const call=async(path,opt={})=>{const h={'Content-Type':'application/json',...(opt.headers||{})};if(token)h.Authorization='Bearer '+token;const r=await fetch(API+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||'تعذر تنفيذ الطلب');return d};
$('login-form').onsubmit=async e=>{e.preventDefault();try{const d=await call('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(!['admin','owner'].some(x=>(d.user.roles||[]).includes(x)))throw Error('هذا الحساب ليس مديرًا');token=d.accessToken;localStorage.setItem(TOKEN,token);open()}catch(x){msg('login-msg',x.message)}};
function open(){ $('login-card').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');load() }
$('logout').onclick=async()=>{try{await call('/api/auth/logout',{method:'POST'})}catch{}localStorage.removeItem(TOKEN);token=null;location.reload()};$('refresh').onclick=load;
async function load(){try{const [u,o]=await Promise.all([call('/api/admin/users'),call('/api/admin/overview')]);$('db-label').textContent='الحساب: '+o.accountId+' · قاعدة البيانات: '+o.database;const labels={users:'العاملون',access_requests:'طلبات الوصول',customers:'العملاء',suppliers:'الموردون',shipment_cards:'الشحنات',invoices:'الفواتير',sms_messages:'الرسائل',audit_logs:'سجل التدقيق'};$('stats').innerHTML=Object.entries(o.counts).map(([k,v])=>`<div class="stat"><b>${v}</b>${labels[k]||k}</div>`).join('');renderUsers(u.data||[])}catch(x){alert(x.message);if(['INVALID_TOKEN','SESSION_REVOKED','AUTH_REQUIRED'].includes(x.message)){localStorage.removeItem(TOKEN);location.reload()}}}
const roles=[['sales','مبيعات'],['accountant','محاسب'],['shipment_receiver','استقبال شحنات'],['message_operator','مشرف رسائل'],['report_viewer','مشاهد تقارير'],['admin','مدير']];const perms=[['invoices.view','عرض الفواتير'],['invoices.create','إنشاء الفواتير'],['invoices.edit','تعديل الفواتير'],['shipments.view','عرض الشحنات'],['shipments.create','إضافة الشحنات'],['shipments.edit','تعديل الشحنات'],['customers.view','عرض العملاء'],['customers.edit','تعديل العملاء'],['sms.read','قراءة الرسائل'],['sms.generate_reply','توليد الردود'],['sms.send','إرسال SMS'],['reports.export','تصدير التقارير']];
function copyText(text){if(navigator.clipboard)return navigator.clipboard.writeText(text);const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();return Promise.resolve()}
function renderUsers(list){$('users').innerHTML=list.length?list.map(u=>{const blocked=['blocked','left_company'].includes(u.status),pending=u.status==='pending';return `<article class="user" data-id="${u.id}" data-name="${esc(u.full_name||'')}" data-phone="${esc(u.phone||'')}" data-request="${esc(u.access_request_id||'')}"><div class="user-head"><div><b>${esc(u.full_name||u.employee_code)}</b><br><small>الهاتف: ${esc(u.phone||'—')}<br>رقم الطلب: ${esc(u.access_request_id||'غير موجود')}</small><br><span class="badge ${u.status}">${esc(u.status)}</span> <span class="badge">الدور: ${esc((u.roles||[]).join(', ')||'غير محدد')}</span></div><div class="actions"><button class="btn secondary copy-user">نسخ البيانات</button><button class="btn green approve" ${pending?'':'disabled'}>قبول</button><button class="btn orange code">رمز الموافقة</button><button class="btn red reject" ${pending?'':'disabled'}>رفض</button><button class="btn secondary access">الصلاحيات</button><button class="btn red toggle">${blocked?'رفع الحظر':'حظر'}</button></div></div><div class="perm-box hidden"></div></article>`}).join(''):'لا يوجد مستخدمون';document.querySelectorAll('.user').forEach(bind)}
function bind(card){const id=card.dataset.id;card.querySelector('.copy-user').onclick=()=>copyText('الاسم: '+card.dataset.name+'\nالهاتف: '+card.dataset.phone+'\nرقم الطلب: '+card.dataset.request).then(()=>alert('تم نسخ بيانات المستخدم'));card.querySelector('.approve').onclick=async()=>{await action('/api/admin/users/'+id+'/approve','POST',{},'تم قبول المستخدم وتفعيله')};card.querySelector('.reject').onclick=async()=>{const reason=prompt('سبب الرفض (اختياري):','لم تتم الموافقة');if(reason!==null)await action('/api/admin/users/'+id+'/reject','POST',{reason},'تم رفض الطلب')};card.querySelector('.code').onclick=async()=>{try{const d=await call('/api/admin/users/'+id+'/issue-code',{method:'POST',body:'{}'});const text='الاسم: '+card.dataset.name+'\nالهاتف: '+card.dataset.phone+'\nرقم الطلب: '+d.requestId+'\nرمز الموافقة: '+d.approvalCode;await copyText(text);alert('تم نسخ بيانات المستخدم ورمز الموافقة.\n\n'+text)}catch(x){alert(x.message)}};card.querySelector('.toggle').onclick=async()=>{const blocked=card.querySelector('.toggle').textContent.includes('رفع');await action('/api/admin/users/'+id+'/'+(blocked?'unblock':'block'),'POST',{reason:'قرار إداري'},blocked?'تم رفع الحظر':'تم حظر المستخدم')};card.querySelector('.access').onclick=()=>showAccess(card)}
async function action(path,method,body,text){try{await call(path,{method,body:JSON.stringify(body)});alert(text);load()}catch(x){alert(x.message)}}
function showAccess(card){const box=card.querySelector('.perm-box');const id=card.dataset.id;box.classList.toggle('hidden');box.innerHTML=`<b>تحديد الدور والصلاحيات</b><select id="role-${id}">${roles.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select><div class="perms">${perms.map(x=>`<label><input type="checkbox" value="${x[0]}"> ${x[1]}</label>`).join('')}</div><div class="actions"><button class="btn green save">حفظ الصلاحيات</button><button class="btn secondary close">إغلاق</button></div>`;box.querySelector('.close').onclick=()=>box.classList.add('hidden');box.querySelector('.save').onclick=async()=>{const permissions=[...box.querySelectorAll('input:checked')].map(x=>x.value);await action('/api/admin/users/'+id+'/access','PUT',{role:box.querySelector('select').value,permissions},'تم حفظ الصلاحيات')};}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}if(token)call('/api/auth/me').then(d=>{if(['admin','owner'].some(x=>(d.user.roles||[]).includes(x)))open();else{localStorage.removeItem(TOKEN);token=null}}).catch(()=>{localStorage.removeItem(TOKEN);token=null});
})();
</script>
</body></html>
